name: Dawn
options:
  bundleIdPrefix: com.sulavshrestha
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.1"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.87.1"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Dawn:
    type: application
    platform: iOS
    sources:
      - path: Dawn
      # Compiled into the app *and* every extension. See Shared/GateBridge.swift.
      - path: Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      # Embeds the three Screen Time extensions in the app bundle.
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: DeviceActivityMonitor
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: JournalBlock
        # An empty UILaunchScreen renders systemBackground and then hands
        # over to the app canvas. That flash is the first thing a user sees
        # every morning, so the launch colour is a colourset with both
        # appearances in it and follows whichever one is showing.
        #
        # No UIUserInterfaceStyle key: the app used to pin itself to Light.
        # Appearance is now Preferences.appearance, applied at the root via
        # .preferredColorScheme.
        UILaunchScreen:
          UIColorName: LaunchCanvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAlarmKitUsageDescription: "JournalBlock rings an alarm at the sitting you asked it to wake you for."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          # Supabase sends confirmation and password-reset links here, so the
          # email opens the app instead of Safari.
          - CFBundleTypeRole: Editor
            CFBundleURLName: supabase-auth
            CFBundleURLSchemes:
              - journalblock
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-sign-in
            # REVERSED_CLIENT_ID for the Google OAuth callback. Must stay in
            # step with AppConfig.googleClientID.
            CFBundleURLSchemes:
              - com.googleusercontent.apps.552894245808-p0rl1uptn42343j14mrpmh5uacmgeuea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sulav.journalblock
        PRODUCT_NAME: Dawn
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6LYZDNCM4M
        CODE_SIGN_ENTITLEMENTS: Dawn/Dawn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal

  # --- Screen Time --------------------------------------------------------
  #
  # Three separate extensions because the system launches them for three
  # different reasons: to draw a shield, to answer a tap on one, and to re-arm
  # the shield on a schedule while the app isn't running. All three need
  # `com.apple.developer.family-controls` and the shared app group.

  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfiguration
      - path: Shared
    info:
      path: ShieldConfiguration/Info.plist
      # XcodeGen *generates* this plist, so NSExtension has to be declared here
      # rather than hand-written into the file — anything written there is
      # overwritten on the next `xcodegen generate`, and an extension with no
      # NSExtension dict is one the system will never launch.
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sulav.journalblock.ShieldConfiguration
        PRODUCT_NAME: ShieldConfiguration
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6LYZDNCM4M
        CODE_SIGN_ENTITLEMENTS: ShieldConfiguration/ShieldConfiguration.entitlements
        SWIFT_STRICT_CONCURRENCY: minimal

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
      - path: Shared
    info:
      path: ShieldAction/Info.plist
      # XcodeGen *generates* this plist, so NSExtension has to be declared here
      # rather than hand-written into the file — anything written there is
      # overwritten on the next `xcodegen generate`, and an extension with no
      # NSExtension dict is one the system will never launch.
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sulav.journalblock.ShieldAction
        PRODUCT_NAME: ShieldAction
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6LYZDNCM4M
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
        SWIFT_STRICT_CONCURRENCY: minimal

  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitor
      - path: Shared
    info:
      path: DeviceActivityMonitor/Info.plist
      # XcodeGen *generates* this plist, so NSExtension has to be declared here
      # rather than hand-written into the file — anything written there is
      # overwritten on the next `xcodegen generate`, and an extension with no
      # NSExtension dict is one the system will never launch.
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).GateMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sulav.journalblock.DeviceActivityMonitor
        PRODUCT_NAME: DeviceActivityMonitor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6LYZDNCM4M
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
        SWIFT_STRICT_CONCURRENCY: minimal
